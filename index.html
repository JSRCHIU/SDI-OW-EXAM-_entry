    background-color: #b2ecef;
    background-size: cover;
    background-position: bottom center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .dim {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.38);
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 3.5rem 1.25rem 1rem;
    max-width: 480px;
    margin: 0 auto;
  }

  .logo {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: .5px;
    color: rgba(255,255,255,0.9);
    margin-bottom: .5rem;
  }

  h1 {
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    margin-bottom: .35rem;
    letter-spacing: -.3px;
  }

  .sub {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 2.25rem;
  }

  .card {
    background: rgba(255,255,255,0.15);
    border: 0.5px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 11px;
    border-radius: 20px;
    letter-spacing: .3px;
  }
  .badge-a { background: rgba(230,241,251,0.92); color: #0C447C; }
  .badge-b { background: rgba(234,243,222,0.92); color: #3B6D11; }

  .card-title {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
  }

  .card-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 14px;
    line-height: 1.55;
  }

  .btn-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }

  .btn {
    padding: 11px 4px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover  { background: rgba(255,255,255,0.25); }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: rgba(255,255,255,0.88);
    color: #185FA5;
    border-color: transparent;
    font-weight: 600;
  }
  .btn-primary:hover { background: rgba(255,255,255,1); }

  .footer {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    text-align: center;
    margin-top: 1.5rem;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(20,20,20,0.92);
    color: #fff;
    font-size: 13px;
    padding: 10px 22px;
    border-radius: 24px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (min-width: 769px) {
    .btn-share { display: none; }
  }

  @media (max-width: 380px) {
    .btn { font-size: 12px; padding: 10px 2px; gap: 3px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="dim"></div>

      <button class="btn" onclick="shareLink('https://puredive-nitrox-exam-b.vercel.app/','SDI NITROX 學科測試 B 卷','copy-nitrox-b')" class="btn btn-share">
        &#x2197; 分享
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  function go(url) {
    window.open(url, '_blank');
  }

  function copyLink(url, btnId) {
    const btn = document.getElementById(btnId);
    const orig = btn.innerHTML;
    navigator.clipboard.writeText(url).then(() => {
      btn.innerHTML = '&#x2713; 已複製';
      showToast('連結已複製');
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.innerHTML = '&#x2713; 已複製';
      showToast('連結已複製');
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    });
  }

  function shareLink(url, title, fallbackBtnId) {
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(() => {});
    } else {
      copyLink(url, fallbackBtnId);
      showToast('已複製連結（此裝置不支援分享）');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>

</body>
</html>
